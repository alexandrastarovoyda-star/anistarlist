{% extends "layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block main %}
    <form action="/search" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="anime_title" placeholder="Anime title" type="text" value="{{ anime_title }}">
        </div>
        <div class="d-flex justify-content-center align-items-center gap-3 p-4">
            <div class="mb-3">
                <input autocomplete="off" min="0" class="form-control mx-auto w-auto" name="year" placeholder="Year" type="number" value="{{ year }}">
            </div>
            <div class="mb-3">
                <select name="season" class="form-select mx-auto w-auto">
                    <option value="">All seasons</option>
                    <option value="WINTER" {% if season == "WINTER" %}selected{% endif %}>Winter</option>
                    <option value="SPRING" {% if season == "SPRING" %}selected{% endif %}>Spring</option>
                    <option value="SUMMER" {% if season == "SUMMER" %}selected{% endif %}>Summer</option>
                    <option value="FALL" {% if season == "FALL" %}selected{% endif %}>Fall</option>
                </select>
            </div>
            <div class="mb-3">
                <select name="sorted_by" class="form-select mx-auto w-auto">
                    <option value="">Sort by</option>
                    <option value="rating" {% if sorted_by == "rating" %}selected{% endif %}>Rating</option>
                    <option value="title" {% if sorted_by == "title" %}selected{% endif %}>Title</option>
                    <option value="year" {% if sorted_by == "year" %}selected{% endif %}>Year</option>
                </select>
            </div>
            <div class="mb-3">
                <select name="order" class="form-select mx-auto w-auto">
                    <option value="">⇅</option>
                    <option value="asc" {% if order == "asc" %}selected{% endif %}>Ascending</option>
                    <option value="desc" {% if order == "desc" %}selected{% endif %}>Descending</option>
                </select>
            </div>
        </div>
        <div class="mb-3 text-center">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
        <div class="row g-4">
            {% for anime in animes %}
                <div class="col-md-3">
                    <div class="card h-100">
                        <img src="{{ anime.image_url }}" class="card-img-top" alt="{{ anime.Title }}">
                        <div class="card-body">
                            <a href="/anime/{{ anime.id }}" class="text-decoration-none">
                                <h5 class="card-title">{{ anime.Title }}</h5>
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </form>
{% endblock %}
